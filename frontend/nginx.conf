server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx:alpine chưa map .mjs; thiếu dòng này worker MapLibre bị trả
  # application/octet-stream + nosniff => không chạy được ở bản build.
  # Dùng location + default_type (không dùng `types` vì sẽ ghi đè toàn bộ mime.types).
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; connect-src 'self' https://tiles.openfreemap.org https://server.arcgisonline.com https://*.tile.opentopomap.org ws: wss:; font-src 'self' data:;" always;

  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://server:4000/health;
    proxy_set_header Host $host;
  }

  location /guide/ {
    try_files $uri $uri/ /guide/index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
