name: cors-mvp

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.local
    environment:
      MIGRATIONS_DIR: /db/migrations
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  server:
    image: node:22-alpine
    working_dir: /app
    env_file:
      - .env.local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MIGRATIONS_DIR: /db/migrations
      TSC_WATCHFILE: UsePolling
      TSC_WATCHDIRECTORY: UsePolling
    command:
      - sh
      - -c
      - >-
        npm ci &&
        npm run build &&
        node dist/db/seed.js &&
        (npm run build -- --watch &) &&
        node --watch dist/index.js
    volumes:
      - ./server:/app
      - ./db/migrations:/db/migrations:ro
      - server_node_modules:/app/node_modules
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

  gnss:
    build:
      context: ./gnss
    restart: unless-stopped
    env_file:
      - .env.local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "7080"
    ports:
      - "127.0.0.1:7080:7080"
      - "1509:1509"
      - "1508:1508"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://server:4000
      VITE_HMR_CLIENT_PORT: "3000"
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  frontend_node_modules:
  server_node_modules:
