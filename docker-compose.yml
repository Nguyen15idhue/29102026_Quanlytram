name: cors-mvp

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.local
    environment:
      MIGRATIONS_DIR: /db/migrations
    command: ["node", "dist/db/migrate.js"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env.local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MIGRATIONS_DIR: /db/migrations
    command: ["sh", "-c", "node dist/db/seed.js && node dist/index.js"]
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gnss:
    build:
      context: ./gnss
    restart: unless-stopped
    env_file:
      - .env.local
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "7080"
    ports:
      - "127.0.0.1:7080:7080"
      - "1509:1509"
      - "1508:1508"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: ./frontend
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mysql_data:
